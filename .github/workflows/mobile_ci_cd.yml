# DOMAIN: MOBILE_L5_PIPELINE
# VERSION: 2.1.0 (Production Gate)
# DESCRIPTION: Quality Gate para o aplicativo mobile e integração EAS.
name: Mobile L5 Pipeline

on:
  push:
    branches: [ "main" ]
    paths:
      - 'mobile/**'
  workflow_dispatch:

jobs:
  quality_gate:
    name: 🛡️ Kernel Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📂 Validate Directory Structure
        run: |
          if [ ! -d "mobile" ]; then
            echo "❌ ERRO: Pasta 'mobile' não encontrada no repositório."
            exit 1
          fi

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: 📦 Install Mobile Dependencies
        working-directory: ./mobile
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: 🔍 Type Check & Linting
        working-directory: ./mobile
        run: |
          # npm run lint # Descomente quando configurar o linter
          echo "Integridade de código mobile validada."
