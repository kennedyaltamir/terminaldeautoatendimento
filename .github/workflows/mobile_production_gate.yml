
name: MOBILE_PRODUCTION_GATE

on:
  push:
    branches: [ main ]
    paths:
      - 'mobile/**'

jobs:
  production-lock:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Mobile Deps
        run: |
          cd mobile
          npm install

      - name: Verify Telemetry (Sentry)
        run: python scripts/maintenance/verify_telemetry.py

      - name: Production Lock Validation
        run: python scripts/maintenance/production_lock_mobile.py

      # Opcional: Build de verificação (Dry Run)
      # - name: Prebuild Check
      #   run: |
      #     cd mobile
      #     npx expo prebuild --platform android --clean

 