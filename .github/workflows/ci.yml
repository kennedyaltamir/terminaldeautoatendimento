# DOMAIN: ROOT_CONFIG
# LAST_MODIFIED: 2026-01-08 23:10:00
name: MesaFlow CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ------------------------------------------------------------------
  # JOB 1: GOVERNANCE & COMPLIANCE GATES (Policy-as-Code)
  # ------------------------------------------------------------------
  governance-audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install Dependencies (Minimal)
      run: |
        pip install requests

    - name: 🛡️ Verify ADR Integrity
      run: python scripts/production/verify_adr_integrity.py

    - name: 🛡️ Verify Compliance Mapping
      run: python scripts/production/verify_compliance_mapping.py

    - name: 🛡️ Verify Vendor Risk Management
      run: python scripts/production/verify_vendor_risk.py

    - name: 🛡️ Verify Trust Center Structure
      run: python scripts/production/verify_trust_center.py

    - name: 🛡️ Verify Legal Compliance Docs
      run: python scripts/production/verify_legal_compliance.py

  # ------------------------------------------------------------------
  # JOB 2: BACKEND INTEGRITY (Python + Postgres)
  # ------------------------------------------------------------------
  backend-test:
    needs: governance-audit # Só roda se a governança passar
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: mesaflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Database Migrations (Test DB)
      env:
        DATABASE_URL: postgresql://postgres:password@localhost:5432/mesaflow_test
      run: |
        alembic upgrade head

    - name: Run Pytest
      env:
        DATABASE_URL: postgresql://postgres:password@localhost:5432/mesaflow_test
        SECRET_KEY: "testing_secret_key_mock"
        ENVIRONMENT: "testing"
      run: |
        python -m pytest

  # ------------------------------------------------------------------
  # JOB 3: FRONTEND INTEGRITY (Next.js Build)
  # ------------------------------------------------------------------
  frontend-check:
    needs: governance-audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Dependencies
      run: npm ci

    - name: Type Check & Build Validation
      env:
        NEXT_PUBLIC_API_URL: "http://localhost:8000/api"
      run: npm run build
