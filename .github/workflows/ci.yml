name: MesaFlow CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ------------------------------------------------------------------
  # JOB 1: BACKEND CHECK (Instalação Básica)
  # ------------------------------------------------------------------
  backend-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        # Instala apenas se o arquivo existir para não dar erro
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

  # ------------------------------------------------------------------
  # JOB 2: FRONTEND WEB CHECK (Build do Next.js)
  # ------------------------------------------------------------------
  frontend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        # Garante que roda na pasta frontend, e não na mobile
        working-directory: ./frontend

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Dependencies
      # npm ci é mais rápido e seguro para CI do que npm install
      run: npm ci

    - name: Build Validation
      env:
        # Variáveis dummy para o build passar
        NEXT_PUBLIC_API_URL: "http://localhost:8000/api"
      run: npm run build