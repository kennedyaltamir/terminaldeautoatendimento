name: MesaFlow CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ------------------------------------------------------------------
  # JOB 1: BACKEND INTEGRITY (Python + Postgres)
  # ------------------------------------------------------------------
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: mesaflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # Como é produção, é importante validar se as migrações funcionam
    - name: Run Database Migrations (Test DB)
      env:
        # Usa o banco temporário do CI, não o Neon de produção (segurança)
        DATABASE_URL: postgresql://postgres:password@localhost:5432/mesaflow_test
      run: |
        alembic upgrade head

    # Roda os testes para garantir que nada quebrou
    - name: Run Pytest
      env:
        DATABASE_URL: postgresql://postgres:password@localhost:5432/mesaflow_test
        SECRET_KEY: "testing_secret_key_mock"
        ENVIRONMENT: "testing"
      run: |
        python -m pytest

  # ------------------------------------------------------------------
  # JOB 2: FRONTEND INTEGRITY (Next.js Build)
  # ------------------------------------------------------------------
  frontend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Dependencies
      run: npm ci

    - name: Type Check & Build Validation
      env:
        # Variáveis dummy apenas para o build passar. 
        # As reais de produção estão na Vercel.
        NEXT_PUBLIC_API_URL: "http://localhost:8000/api"
      run: npm run build