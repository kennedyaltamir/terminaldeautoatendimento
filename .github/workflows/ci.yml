# DOMAIN: CI_CD_PIPELINE
# VERSION: 2.1.0 (Production Gold)
# DESCRIPTION: Pipeline de integridade com suporte total a cache e lockfiles.
name: MesaFlow CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'mobile/**'
      - 'docs/**'
      - 'README.md'
  pull_request:
    branches: [ "main" ]

jobs:
  backend-integrity:
    name: 🐍 Backend Core Check
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: 📦 Install Core Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 🔍 Static Analysis
        run: python -m py_compile app/main.py

  frontend-integrity:
    name: ⚛️ Frontend Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🏗️ Production Build Validation
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: "https://api.mesaflow.com.br/api"
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
