[pytest]
# Define onde os testes reais residem
testpaths = tests

# Ignora explicitamente pastas de backup, quarentena e staging
norecursedirs = 
    archive 
    ignorar 
    .venv 
    node_modules 
    backup 
    scripts_old_backup

# Padrões de arquivos de teste
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Configurações de Asyncio para o FastAPI
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function

# Desativa plugins que conflitam com o Python 3.13 no Windows durante a captura
addopts = -p no:sugar --capture=no

