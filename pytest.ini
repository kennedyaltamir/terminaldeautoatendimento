[pytest]
# Define onde os testes reais residem
testpaths = tests

# Ignora explicitamente pastas de backup, quarentena e staging
norecursedirs = 
    archive 
    ignorar 
    .venv 
    node_modules 
    backup 
    scripts_old_backup

# Padrões de arquivos de teste
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Configurações de Asyncio - SGCS/1.4 Standard
asyncio_mode = auto
# Elevamos o escopo padrão para 'module' para suportar fixtures de autenticação compartilhadas
asyncio_default_fixture_loop_scope = module

# Ajustes para Python 3.13 e Windows:
# -s: evita erro de I/O em arquivos fechados
# -v: modo verboso para auditoria de falhas
# -W ignore: silencia avisos de depreciação
addopts = -p no:sugar -s -v --capture=no -W ignore::pytest.PytestRemovedIn9Warning -W ignore::DeprecationWarning

