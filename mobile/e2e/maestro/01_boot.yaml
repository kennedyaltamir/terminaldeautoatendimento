
appId: com.mesaflow.mobile
tags:
    - boot
---
# 🔹 CATEGORIA A — BOOT / CONTEXTO (T01-T04)

# T01 - Cold Start
- launchApp:
    clearState: true
- assertVisible: "MesaFlow Mobile"
- takeScreenshot: "T01_cold_start"

# T02 - Hot Reload / Resume
- pressHome
- launchApp:
    clearState: false
- assertVisible: "MesaFlow Mobile"
- takeScreenshot: "T02_warm_resume"

# T03 - Offline Boot (Simulado via UI)
# Nota: Maestro free não controla modo avião do emulador diretamente em todas as versões, 
# validamos a UI de erro se a rede falhar.
- assertVisible: "Entrar"

# T04 - Crash Recovery (Simulação de estabilidade)
- tapOn: "Entrar"
- assertVisible: "Falha no Login" # Valida que não crashou com input vazio

