# DOMAIN: ROOT_CONFIG
# LAST_MODIFIED: 2026-01-08 23:55:00
services:
  # --------------------------------------------------------------------------------
  # BACKEND (FastAPI)
  # --------------------------------------------------------------------------------
  - type: web
    name: mesaflow-api
    env: python
    region: oregon
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app.main:app --workers 4 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        value: "https://mesaflow.vercel.app,https://app.mesaflow.com.br"
      - key: DOCS_URL
        value: "/docs"
      - key: WEB_CONCURRENCY
        value: "4"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: MP_ACCESS_TOKEN
        sync: false

  # --------------------------------------------------------------------------------
  # WORKER (Celery) - Processamento Assíncrono Persistente
  # --------------------------------------------------------------------------------
  - type: worker
    name: mesaflow-worker
    env: python
    region: oregon
    plan: starter
    buildCommand: pip install -r requirements.txt
    # Inicia o Celery Worker com nível de log INFO
    startCommand: celery -A app.core.celery_app worker --loglevel=info --concurrency=2
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SECRET_KEY
        sync: false
